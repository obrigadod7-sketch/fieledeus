<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" width="800" height="600">
  <!-- Fundo suave -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDF2F8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Nuvem decorativa -->
  <path d="M120 140 C 90 140, 70 170, 70 200 C 70 230, 100 250, 130 250 C 160 250, 190 230, 190 200 C 190 170, 150 140, 120 140 Z" fill="#FBCFE8" filter="url(#shadow)"/>
  <path d="M560 180 C 530 180, 510 210, 510 240 C 510 270, 540 290, 570 290 C 600 290, 630 270, 630 240 C 630 210, 590 180, 560 180 Z" fill="#E0E7FF" filter="url(#shadow)"/>

  <!-- Mão estendida (simplificada) -->
  <g transform="translate(400, 280)">
    <!-- Pulso -->
    <path d="M-60 60 Q -40 120 -20 100 L 20 100 Q 40 120 60 60 L 60 40 Q 40 20 0 20 L -60 40 Z" fill="#FCA5A5" filter="url(#shadow)"/>
    <!-- Dedos -->
    <path d="M-45 60 Q -60 30 -45 10 L -30 10 Q -15 30 0 10 L 15 10 Q 30 30 45 10 L 45 60 Q 30 90 15 90 L -15 90 Q -30 90 -45 60 Z" fill="#FCA5A5" filter="url(#shadow)"/>
    <path d="M-20 45 L -25 25" stroke="#E57373" stroke-width="6" stroke-linecap="round"/>
    <path d="M 0 45 L 5 25" stroke="#E57373" stroke-width="6" stroke-linecap="round"/>
    <path d="M 20 45 L 25 25" stroke="#E57373" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Coração flutuante -->
  <path d="M340 380 Q 320 360 340 340 Q 360 360 340 380 Z" fill="#F472B6" filter="url(#shadow)"/>
  <path d="M460 420 Q 440 400 460 380 Q 480 400 460 420 Z" fill="#F472B6" filter="url(#shadow)"/>

  <!-- Estrelinhas decorativas -->
  <circle cx="200" cy="100" r="3" fill="#FBCFE8"/>
  <circle cx="620" cy="160" r="3" fill="#E0E7FF"/>
  <circle cx="150" cy="400" r="2.5" fill="#FBCFE8"/>
  <circle cx="680" cy="450" r="2.5" fill="#E0E7FF"/>
  <circle cx="300" cy="520" r="3" fill="#FBCFE8"/>

  <!-- Texto decorativo simples (linhas) -->
  <g stroke="#FBCFE8" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <line x1="100" y1="500" x2="180" y2="500"/>
    <line x1="100" y1="520" x2="150" y2="520"/>
    <line x1="600" y1="500" x2="700" y2="500"/>
    <line x1="600" y1="520" x2="640" y2="520"/>
  </g>
</svg>
